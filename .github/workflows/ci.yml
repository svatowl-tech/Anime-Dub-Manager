name: CI & Code Quality

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate build metadata & icons
        run: |
          node scripts/generate-icons.cjs
          node scripts/generate-metadata.js

      - name: TypeScript Check (Linter)
        run: npm run lint

      - name: Vite Web Build Verification
        run: npm run build
