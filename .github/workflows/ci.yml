name: CI & Code Quality

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      YOUTUBE_DL_SKIP_DOWNLOAD: "true"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Configure Git for Windows (support special characters and long paths)
        if: runner.os == 'Windows'
        run: |
          git config --system core.protectNTFS false
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !*.mp4
            !*.mkv
            !*.avi
          sparse-checkout-cone-mode: false

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build metadata & icons
        run: |
          node scripts/generate-icons.cjs
          node scripts/generate-metadata.js

      - name: TypeScript Check (Linter)
        run: npm run lint

      - name: Vite Web Build Verification
        run: npm run build
