name: Build & Release Desktop App & AI Runtime

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Custom Release Notes'
        required: false
        default: 'Automated release build with full AI environment.'

permissions:
  contents: write
  packages: write
  issues: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  YOUTUBE_DL_SKIP_DOWNLOAD: "true"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # 1. Job to prepare or ensure the release exists and obtain version info
  prepare_release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Target Version: ${VERSION}, Tag: ${TAG_NAME}"

      - name: Create or update GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "Anime Dub Manager ${{ steps.get_version.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          body: |
            ## 🎙️ Anime Dub Manager ${{ steps.get_version.outputs.tag_name }}
            
            Автоматическая сборка релиза приложения Anime Dub Manager и портативной нейросетевой среды `AI_env` для Windows, macOS и Linux.
            
            ### 📦 Установочные пакеты приложения:
            - **Windows**: Инсталлятор `.exe` (NSIS) и Портативная версия `.exe` (x64)
            - **macOS**: Образ `.dmg` и `.zip` архив (Universal / Apple Silicon / Intel)
            - **Linux**: Универсальный пакет `.AppImage` и пакет `.deb` (Debian/Ubuntu)
            
            ### 🧠 Портативные нейросетевые среды (AI_env):
            - **Windows (x64)**: `ai_env_windows_x64.zip` (и `ai_env.zip`)
            - **macOS (Apple Silicon)**: `ai_env_macos_arm64.zip`
            - **macOS (Intel x64)**: `ai_env_macos_x64.zip`
            - **Linux (x64)**: `ai_env_linux_x64.zip`
            
            *Включает DeepFilterNet3, Demucs v4 (htdemucs/htdemucs_ft), PyTorch и аудио-процессоры.*
            
            ---
            *Собрано автоматически через GitHub Actions CI/CD.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Build AI Environment (AI_env) for Windows, macOS, and Linux
  build_ai_env:
    name: Build AI Environment (${{ matrix.platform.name }})
    needs: prepare_release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x64)
            os: windows-latest
            tag: windows_x64
            release_files: |
              out/ai_env_windows_x64.zip
              out/ai_env.zip
            artifact_name: AI_env-Windows-x64
          - name: macOS (Apple Silicon arm64)
            os: macos-latest
            tag: macos_arm64
            release_files: |
              out/ai_env_macos_arm64.zip
            artifact_name: AI_env-macOS-arm64
          - name: macOS (Intel x64)
            os: macos-13
            tag: macos_x64
            release_files: |
              out/ai_env_macos_x64.zip
            artifact_name: AI_env-macOS-x64
          - name: Linux (x64)
            os: ubuntu-latest
            tag: linux_x64
            release_files: |
              out/ai_env_linux_x64.zip
            artifact_name: AI_env-Linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Portable AI Environment
        run: python scripts/build-ai-env.py --tag ${{ matrix.platform.tag }}
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"

      - name: Upload AI_env to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag_name }}
          files: ${{ matrix.platform.release_files }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AI_env Artifact to CI Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: out/ai_env*.zip
          if-no-files-found: warn

  # 3. Build Desktop Application Binaries for Windows, macOS, and Linux
  build_binaries:
    name: Build (${{ matrix.platform.name }})
    needs: prepare_release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x64)
            os: windows-latest
            release_files: |
              out/*.exe
              out/latest.yml
            artifact_name: AnimeDubManager-Windows-binaries
          - name: macOS (x64 / Universal)
            os: macos-latest
            release_files: |
              out/*.dmg
              out/*.zip
              out/latest-mac.yml
            artifact_name: AnimeDubManager-macOS-binaries
          - name: Linux (AppImage / DEB)
            os: ubuntu-latest
            release_files: |
              out/*.AppImage
              out/*.deb
              out/latest-linux.yml
            artifact_name: AnimeDubManager-Linux-binaries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools dpkg fakeroot rpm graphicsmagick icnsutils

      - name: Install npm dependencies
        run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Cross-Platform Icons
        run: node scripts/generate-icons.cjs

      - name: Cache FFmpeg Binaries
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: assets/bin
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/download-ffmpeg.js') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Download & Setup FFmpeg Binaries
        run: node scripts/download-ffmpeg.js
        env:
          NODE_ENV: production

      - name: Generate App Metadata
        run: node scripts/generate-metadata.js

      - name: Prepare Sidecars & Local ML Assets
        run: node scripts/prepare-sidecars.js

      - name: Build Web Frontend (Vite)
        run: npm run build

      - name: Build Desktop Application (electron-builder)
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag_name }}
          files: ${{ matrix.platform.release_files }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts as CI Workflow Backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: |
            out/*.exe
            out/*.dmg
            out/*.zip
            out/*.AppImage
            out/*.deb
          if-no-files-found: warn
